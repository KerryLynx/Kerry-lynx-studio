<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <title>Asset Test Viewer | Kerry Lynx</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#0b0b0b;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      gap:20px;
    }

    .card{
      background: rgba(255,255,255,0.05);
      padding:20px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.1);
      text-align:center;
      max-width:500px;
    }

    img{
      width:100%;
      max-width:350px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.2);
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    h1{
      font-size:18px;
      margin-bottom:10px;
    }

    p{
      font-size:13px;
      color:#aaa;
    }

    .status{
      margin-top:10px;
      font-size:12px;
      color:lime;
    }
  </style>

</head>

<body>

  <div class="card">
    <h1>🧪 Asset Test Viewer</h1>
    <p>Checking image path: assets/img/business.jpg</p>

    <img src="assets/img/business.jpg" alt="Business Image">

    <div class="status">
      If image appears → path is correct ✔
    </div>
  </div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 900,
    once: true
  });
</script>

</body>
</html>
